<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cek Pesanan - Telur Asin Nusantara</title>

</head>
<body>

    <a class="brand" href="/">🥚 Telur Asin Nusantara</a>

    <h2>Cek Status Pesanan</h2>

      <button class="btn primary" type="submit">Cek</button>
    </form>
    <div id="hasil"></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/konfirmasi.js"></script>
</body>
</html>
